[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cron-ops"
version = "1.0.0"
description = "Universal cron job health checker for any agent (Hermes, Claude Code, OpenCode, Codex) — fail alerts, latency watch, error diagnosis"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "nicokickcpython" }]
keywords = ["cron", "agent", "hermes", "claude-code", "opencode", "monitoring", "alerting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/nicokickcpython/cronwatch"
Repository = "https://github.com/nicokickcpython/cronwatch"
Issues = "https://github.com/nicokickcpython/cronwatch/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.0"]

[project.scripts]
cron-ops = "cron_ops.cli:main"
cron-ops-wrap = "cron_ops.wrap:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["cron_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
