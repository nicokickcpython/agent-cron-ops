[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cronwatch"
version = "1.0.0"
description = "Universal cron job health checker for any agent (Hermes, Claude Code, OpenCode, Codex) — fail alerts, latency watch, error diagnosis"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nicokickcpython" }]
keywords = ["cron", "agent", "hermes", "claude-code", "opencode", "monitoring", "alerting"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.scripts]
cron-ops = "cron_ops.cli:main"
cron-ops-wrap = "cron_ops.wrap:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["cron_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
